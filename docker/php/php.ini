; php.ini - PHP configuration for SICRES
; Profile: Production-ready with development adjustments

[PHP]
; ============================================================
; Performance
; ============================================================
memory_limit = 256M
max_execution_time = 120
max_input_time = 60
max_input_vars = 3000

post_max_size = 50M
upload_max_filesize = 40M
max_file_uploads = 20

; ============================================================
; Error handling
; ============================================================
; In production: error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

; ============================================================
; OPcache (shared memory bytecode cache)
; ============================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; In production set to 0 for best performance
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.fast_shutdown = 1

; ============================================================
; Date & Timezone
; ============================================================
[Date]
date.timezone = Africa/Douala

; ============================================================
; Session
; ============================================================
[Session]
session.gc_maxlifetime = 1440
session.cookie_secure = Off
session.cookie_httponly = On
session.use_strict_mode = On
session.cookie_samesite = Lax

; ============================================================
; Security - disable dangerous functions
; ============================================================
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; ============================================================
; File uploads
; ============================================================
file_uploads = On

; ============================================================
; Miscellaneous
; ============================================================
default_charset = UTF-8
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
