; www.conf - PHP-FPM pool configuration for SICRES
; Pool "www" - Optimized for Laravel on Docker

[www]

; Process identity
user = www-data
group = www-data

; Listen on TCP socket (required for Docker networking)
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager - dynamic mode
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Request timeout (seconds)
request_terminate_timeout = 120

; Logging
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mk"

slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Environment variables passed to PHP-FPM workers
; (Docker injects APP_ENV, DB_*, REDIS_* etc. via compose.yaml)
clear_env = no

; PHP flags
php_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 256M

; OPcache settings
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128

; Session handling via Redis (set in backend .env)
; php_admin_value[session.save_handler] = redis
; php_admin_value[session.save_path] = "tcp://redis:6379"

; Security - disable dangerous functions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source
