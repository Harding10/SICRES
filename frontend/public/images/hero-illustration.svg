<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8faf9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="100%" stop-color="#3d2412"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a36"/>
      <stop offset="100%" stop-color="#003822"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fond de bureau -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="50" y="380" width="700" height="120" fill="#cbd5e1" opacity="0.5"/>

  <!-- Illustration Personne (Professionnelle) -->
  <g id="person" transform="translate(180, 40)">
    <!-- Cheveux -->
    <path d="M 120 70 Q 200 10 280 70 Q 300 150 280 200 Q 200 220 120 200 Z" fill="#1a0f0a"/>
    
    <!-- Visage & Cou -->
    <path d="M 150 100 Q 200 100 250 100 Q 260 170 200 220 Q 140 170 150 100 Z" fill="url(#skin)"/>
    <rect x="185" y="200" width="30" height="50" fill="url(#skin)"/>

    <!-- Vêtements (Veste Verte SICRES) -->
    <path d="M 100 240 Q 200 220 300 240 L 340 400 L 60 400 Z" fill="url(#suit)"/>
    <polygon points="200,240 170,320 200,340 230,320" fill="#ffffff"/>

    <!-- Tablette dans les mains -->
    <g transform="translate(80, 260)" filter="url(#shadow)">
      <rect width="240" height="150" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
      <rect x="10" y="10" width="220" height="130" rx="6" fill="#ffffff"/>
      
      <!-- Graphiques sur la tablette -->
      <rect x="20" y="20" width="80" height="40" rx="4" fill="#edf7f2"/>
      <text x="30" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#005a36">142</text>
      
      <rect x="110" y="20" width="90" height="40" rx="4" fill="#edf7f2"/>
      <text x="120" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#005a36">85%</text>

      <path d="M 20 120 L 60 90 L 100 105 L 150 75 L 200 80" fill="none" stroke="#10b981" stroke-width="3"/>
    </g>
  </g>
</svg>
