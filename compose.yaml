###############################################################################
# Docker Compose - SICRES
# Système de Recensement des Établissements Scolaires
# Maintainer: BEH DEGRY JEREMIE HARDING
###############################################################################

name: sicres

services:

  ###############################################################################
  # PHP-FPM — Backend Laravel 13
  ###############################################################################
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: sicres_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - php_storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sicres_db}
      - DB_USERNAME=${DB_USERNAME:-sicres_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sicres_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t && echo OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ###############################################################################
  # Queue Worker — Laravel Queues
  ###############################################################################
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: sicres_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - php_storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sicres_db}
      - DB_USERNAME=${DB_USERNAME:-sicres_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sicres_network

  ###############################################################################
  # Nginx — Reverse Proxy
  ###############################################################################
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: sicres_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      php:
        condition: service_healthy
    networks:
      - sicres_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  ###############################################################################
  # Frontend — Next.js
  ###############################################################################
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sicres_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - WATCHPACK_POLLING=true
    depends_on:
      - nginx
    networks:
      - sicres_network

  ###############################################################################
  # PostgreSQL — Base de données
  ###############################################################################
  postgres:
    image: postgres:17-alpine
    container_name: sicres_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXPOSED:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sicres_db}
      POSTGRES_USER: ${DB_USERNAME:-sicres_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/conf:/etc/postgresql/conf.d:ro
      - ./docker/postgres/backups:/backups
    networks:
      - sicres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sicres_user} -d ${DB_DATABASE:-sicres_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ###############################################################################
  # Redis — Cache & Sessions & Queues
  ###############################################################################
  redis:
    image: redis:7-alpine
    container_name: sicres_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSED:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-sicres_redis_secret} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - sicres_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sicres_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ###############################################################################
  # Mailpit — Serveur mail de développement
  ###############################################################################
  mailpit:
    image: axllent/mailpit:latest
    container_name: sicres_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - sicres_network

  ###############################################################################
  # pgAdmin — Interface d'administration PostgreSQL
  ###############################################################################
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sicres_pgadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sicres.gouv.cm}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_sicres_2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sicres_network

###############################################################################
# Volumes persistants
###############################################################################
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  php_storage:
    driver: local
  nginx_logs:
    driver: local
  pgadmin_data:
    driver: local

###############################################################################
# Réseau interne isolé
###############################################################################
networks:
  sicres_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
